<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Glyph Tracer — fx frame harness</title>
<link rel="icon" href="../favicon.svg">
<style>
  body { margin: 0; background: #E7E8EA; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="460" height="460"></canvas>

<script type="module">
// A harness, not a sandbox: it draws one named effect at an elapsed time you give it,
// and never runs a clock of its own. Nothing here races requestAnimationFrame, so a
// capture is the same frame every run -- which is what makes a recording of an effect
// worth comparing against the next one.
//
//   window.SCENES          the effects it can draw
//   window.load(name)      set one up; returns its total length in ms
//   window.renderAt(ms)    draw that effect at ms
//
// Drive it from outside, a frame at a time, and encode the stills however you like.

import { ANCHOR, PUSH_RIGHT, applySwap, blankBoard, copyBoard, createRecorder, settle } from '../src/board.js';
import { beamReach, beamStyleFor, targetsFor } from '../src/abilityFx.js';
import { buildTimeline, sampleTimeline, staticFrame } from '../src/animate.js';
import { createCompositor } from '../src/compositor.js';
import { beamSpan, drawBeam, ghostAt, grabAt, swellAt } from '../src/fx.js';
import { createBurstLayer, createFlashLayer } from '../src/fxLayer.js';
import { CELL } from '../src/glyphShapes.js';
import { resolvePalette } from '../src/palette.js';
import { mulberry32 } from '../src/rng.js';
import { boardLayout, cellCenter, createGlyphLayer, createGroundLayer, drawGlyph, VIEW } from '../src/render.js';

const load = async (p) => (await fetch(p)).json();
const PALETTE = resolvePalette(await load('../data/palette.json'));
const GLOSS = await load('../data/gloss.json');
const GEOMETRY = await load('../data/geometry.json');
const PATHS = (await load('../data/glyphPaths.json')).paths;
const GLYPHS = (await load('../data/glyphs.json')).glyphs;
const ANIM = await load('../data/animation.json');
const RULES = await load('../data/rules.json');
const byId = new Map(GLYPHS.map((g) => [g.id, g]));
const byKind = new Map(GLYPHS.map((g) => [g.kind, g]));

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const VIEW_HERE = { ...VIEW, hudHeight: 0, pad: 20, gap: 4 };
const SIZE = 5;
const MID = 2;

// The beam every ability throws, tuned where the two sandboxes landed.
// A thrown beam leaves and dissipates; a grabbed one reaches out and holds on. The
// numbers are where the two sandboxes landed on tracer and halo.
const THROW = { travelMs: 300, reachCells: 3.0, chase: 0.85, width: 0.10, swell: 1.6, alpha: 1, outline: 3 };
const GRAB = { travelMs: 480, reachMs: 150, width: 0.16, swell: 1.0, alpha: 0.92, outline: 3 };

/** A board of plain pieces, so every ability has something in reach to act on. */
function bed() {
  const b = blankBoard({ ...RULES, width: SIZE, height: SIZE, colors: PALETTE.colors.length });
  const rand = mulberry32(708);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      b.bg[r][c] = Math.floor(rand() * PALETTE.colors.length);
      const ink = Math.floor(rand() * (PALETTE.colors.length - 1));
      b.glyph[r][c] = ink >= b.bg[r][c] ? ink + 1 : ink;
      b.kind[r][c] = '';
      b.art[r][c] = 'inert';
    }
  }
  return b;
}

/**
 * Dress a cell: a drawing, an ink and a ground, with no ability behind any of it.
 * The art layer never decides what a piece does, which is what makes it safe to pick
 * a shape here purely so the eye can follow one piece from where it was to where it
 * went.
 */
function mark(b, r, c, art, ink, ground) {
  b.art[r][c] = art;
  b.kind[r][c] = '';
  b.glyph[r][c] = ink;
  b.bg[r][c] = ground;
}

function put(b, r, c, glyph) {
  b.kind[r][c] = glyph.kind;
  b.art[r][c] = glyph.id;
}

/** Land a cell on its own colour and let the rules answer. */
function resolveAt(b, r, c) {
  b.glyph[r][c] = b.bg[r][c];
  const before = copyBoard(b);
  const recorder = createRecorder();
  settle(b, mulberry32(9), recorder);
  const timeline = buildTimeline({ before, swap: [[r, c], [r, c]], recorder, timing: ANIM });
  const opening = timeline.phases[0];
  return { before, recorder, timeline, firedAt: opening.tweenMs + opening.holdMs, at: [r, c] };
}

export const SCENES = {
  pulse: () => { const b = bed(); put(b, MID, MID, byKind.get('pulse')); return resolveAt(b, MID, MID); },
  swapOrth: () => {
    const b = bed();
    put(b, MID, MID, byKind.get('swapOrth'));
    // All four move here, so all four are told apart -- and each ink is picked to
    // disagree with the ground it is heading for, or the trade would land a piece on
    // its own colour and the demonstration would chain into something else.
    mark(b, 1, 2, 'pulse', 0, 2);
    mark(b, 3, 2, 'sink', 3, 1);
    mark(b, 2, 1, 'push-up', 2, 0);
    mark(b, 2, 3, 'swap-orth', 1, 3);
    return resolveAt(b, MID, MID);
  },
  // A single-axis swap is only legible if the pair it moves and the pair it leaves
  // alone are both told apart. Four marked neighbours: two trade places, two sit
  // still, and the difference from the cross is the whole point of the glyph.
  swapVert: () => {
    const b = bed();
    put(b, MID, MID, byKind.get('swapVert'));
    mark(b, 1, 2, 'pulse', 0, 2);      // trades
    mark(b, 3, 2, 'sink', 3, 1);       // trades
    mark(b, 2, 1, 'push-up', 2, 0);    // stays
    mark(b, 2, 3, 'swap-orth', 1, 3);  // stays
    return resolveAt(b, MID, MID);
  },
  swapDiagUp: () => {
    const b = bed();
    put(b, MID, MID, byKind.get('swapDiagUp'));
    mark(b, 1, 3, 'pulse', 0, 2);      // trades
    mark(b, 3, 1, 'sink', 3, 1);       // trades
    mark(b, 1, 1, 'push-up', 2, 0);    // stays
    mark(b, 3, 3, 'swap-orth', 1, 3);  // stays
    return resolveAt(b, MID, MID);
  },
  swapDiag: () => {
    const b = bed();
    put(b, MID, MID, byKind.get('swapDiag'));
    // The pieces are what move, so they have to be told apart: the two that trade are
    // given different shapes, different inks and different ground. A swap between two
    // pieces that look alike is a swap nobody can see happen.
    mark(b, 1, 1, 'pulse', 0, 2);
    mark(b, 3, 3, 'sink', 3, 1);
    mark(b, 1, 3, 'push-up', 2, 0);
    mark(b, 3, 1, 'swap-orth', 1, 3);
    return resolveAt(b, MID, MID);
  },
  sink: () => { const b = bed(); put(b, MID, MID, byKind.get('sink')); return resolveAt(b, MID, MID); },
  inert: () => { const b = bed(); return resolveAt(b, MID, MID); },
  // The anchor never fires, so its swallow has to be caused: a push two cells away
  // drives its neighbour into the anchor, which eats it and stays put.
  anchorSwallow: () => {
    const b = bed();
    put(b, MID, MID, byKind.get(ANCHOR));
    put(b, MID, 0, byKind.get(PUSH_RIGHT));
    // The push throws three cells, which would carry its beam clean through the anchor
    // and out the far side. Pieces beyond it make the stop legible rather than academic.
    mark(b, MID, 1, 'pulse', 0, 2);
    mark(b, MID, 3, 'swap-diag', 3, 1);
    mark(b, MID, 4, 'sink', 1, 3);
    return resolveAt(b, MID, 0);
  },
  anchorClear: () => { const b = bed(); put(b, MID, MID, byKind.get(ANCHOR)); return resolveAt(b, MID, MID); },
  // The two already tuned, so the plate covers every glyph in the pack.
  push: () => { const b = bed(); put(b, MID, MID, byKind.get(PUSH_RIGHT)); return resolveAt(b, MID, MID); },
  rotate: () => { const b = bed(); put(b, MID, MID, byKind.get('rotate')); return resolveAt(b, MID, MID); },
  // A swap that sets nothing off. Nothing fires, so nothing throws a beam or a ghost.
  dud: () => {
    const b = bed();
    mark(b, MID, 0, 'push-right', 0, 2);
    mark(b, MID, SIZE - 1, 'sink', 3, 1);
    const before = copyBoard(b);
    const recorder = createRecorder();
    applySwap(b, [MID, 0], [MID, SIZE - 1], mulberry32(9), recorder);
    return {
      before, recorder, noFx: true, at: [MID, 0], firedAt: 0,
      timeline: buildTimeline({ before, swap: [[MID, 0], [MID, SIZE - 1]], recorder, timing: ANIM }),
    };
  },
  // A level won: everything left goes, the board holds empty, the next one grows in.
  finale: () => {
    const b = bed();
    put(b, MID, MID, byKind.get('pulse'));
    b.glyph[MID][MID] = b.bg[MID][MID];
    const before = copyBoard(b);
    const recorder = createRecorder();
    settle(b, mulberry32(9), recorder);
    const next = bed();
    return {
      before, recorder, noFx: true, at: [MID, MID], firedAt: 0,
      timeline: buildTimeline({
        before, swap: [[MID, MID], [MID, MID]], recorder, timing: ANIM,
        finale: { from: copyBoard(b), to: next },
      }),
    };
  },
  // A board already half gone, so the tray's sockets and its deepening rim are visible.
  drained: () => {
    const b = bed();
    for (const [r, c] of [[0, 1], [1, 3], [2, 0], [3, 2], [4, 4], [1, 1], [3, 4]]) {
      b.alive[r][c] = false; b.glyph[r][c] = null; b.kind[r][c] = ''; b.art[r][c] = null;
    }
    put(b, MID, MID, byKind.get('pulse'));
    return resolveAt(b, MID, MID);
  },
  // How far a colour can travel toward white depends on the colour. One scene per live
  // colour under the piece that fires -- identical otherwise -- so the flash can be
  // watched on each rather than read off a table.
  ...Object.fromEntries(PALETTE.colors.map((colour, i) => [`flash-${colour.name}`, () => {
    const b = bed();
    put(b, MID, MID, byKind.get(PUSH_RIGHT));
    b.bg[MID][MID] = i;
    return resolveAt(b, MID, MID);
  }])),
};
window.SCENES = Object.keys(SCENES);

let scene = null;
window.load = (name) => {
  scene = { ...SCENES[name](), name };
  return scene.timeline.totalMs;
};

/**
 * The effects layer: beams for an ability that throws them, a ghost for one that does
 * not. Between the ground and the pieces, so a beam reads as holding what it grabbed.
 */
const fxLayer = {
  name: 'fx',
  draw(c2, frame) {
    if (scene.noFx) return;
    const { layout, elapsed } = frame;
    c2.beginPath();
    c2.rect(layout.originX, layout.originY, layout.spanW, layout.spanH);
    c2.clip();

    const [r, c] = scene.at;
    const kind = scene.before.kind[r][c];
    const ink = PALETTE.colors[scene.before.glyph[r][c]].hex;
    const from = cellCenter(layout, r, c, VIEW_HERE);
    const since = elapsed - scene.firedAt;

    // --- beams ---------------------------------------------------------------
    const style = beamStyleFor(kind);
    if (style) {
      const tune = style === 'throw' ? THROW : GRAB;
      const bt = since / tune.travelMs;
      if (bt > 0 && bt < 1) {
        const env = swellAt(bt, tune.swell);
        const step = layout.cell + VIEW_HERE.gap;
        // Where every piece is headed, read once: a scan per target inside a per-frame
        // draw is the same answer worked out four times over.
        const arriving = new Map();
        for (const sprite of frame.sprites) {
          if (sprite.to) arriving.set(String(sprite.to), sprite);
        }
        for (const cell of targetsFor(kind, scene.at, scene.before)) {
          let root = from;
          let tip;
          if (style === 'throw') {
            // Away from the cell, along the line to what it is shoving, and onward:
            // a shove does not stop where the piece was standing.
            const a = Math.atan2(cell[0] - r, cell[1] - c);
            // An anchor is the end of a line as far as the rules are concerned, so a
            // beam sailing through one would be drawing past where the effect stopped.
            const dir = [Math.sign(cell[0] - r), Math.sign(cell[1] - c)];
            const reach = beamReach(scene.before, scene.at, dir, tune.reachCells);
            const span = beamSpan(bt, reach * step, tune.chase);
            root = { x: from.x + Math.cos(a) * span.from, y: from.y + Math.sin(a) * span.from };
            tip = { x: from.x + Math.cos(a) * span.to, y: from.y + Math.sin(a) * span.to };
          } else {
            // Onto the piece, and thereafter wherever the rules have taken it.
            const held = arriving.get(String(cell));
            const target = held
              ? cellCenter(layout, held.y, held.x, VIEW_HERE)
              : cellCenter(layout, cell[0], cell[1], VIEW_HERE);
            tip = grabAt(since, tune.reachMs, from, target);
          }
          drawBeam(c2, {
            x: root.x, y: root.y, tipX: tip.x, tipY: tip.y,
            width: tune.width * layout.cell * env + 1,
            alpha: tune.alpha * env,
            hex: ink,
            keyline: tune.outline,
            key: PALETTE.key,
          });
        }
      }
    }

  },
};

/**
 * The ghost sits ABOVE the pieces, unlike a beam. A beam is holding something, so it
 * belongs behind it; a ghost is coming off the piece itself, and behind the glyph a
 * ten-percent outline is entirely hidden by the glyph that cast it.
 */
const ghostLayer = {
  name: 'ghost',
  draw(c2, frame) {
    if (scene.noFx) return;
    const { layout, elapsed } = frame;
    const [r, c] = scene.at;
    const glyph = byId.get(scene.before.art[r][c]);
    const since = elapsed - scene.firedAt;
    const ghosts = [];
    // A swallow is not the firing glyph's event: whoever fired, the piece is eaten at
    // the eater's doorstep, and it is the EATER that pulses. Gating this on the glyph
    // that fired would mean an anchor only ever reacted to itself.
    const swallowed = new Set();
    for (const step of scene.recorder.steps) {
      for (const e of step.events) {
        if (e.type === 'eat' && e.reason === 'eater') swallowed.add(String(e.into));
      }
    }
    for (const into of swallowed) {
      const cell = into.split(',').map(Number);
      const eater = byId.get(scene.before.art[cell[0]][cell[1]]);
      if (!eater || eater.exit !== 'ghost') continue;
      ghosts.push({
        cell,
        grow: ANIM.ghost.swallowGrow,
        glyph: eater,
      });
    }
    // Its own clearing is the firing glyph's event, and the big one.
    if (glyph.exit === 'ghost') {
      ghosts.push({ cell: scene.at, grow: ANIM.ghost.clearGrow, glyph });
    }
    // A piece with no ability throws nothing, so it swells its own outline instead.
    // Filling it would paint nothing: a piece only activates by landing on its own
    // colour, so its ink is the colour of the cell it is standing on.
    if (glyph.exit === 'grow') {
      ghosts.push({ cell: scene.at, grow: ANIM.grow, glyph });
    }

    for (const g of ghosts) {
      const { scale, alpha } = ghostAt(since / ANIM.ghost.ms, g.grow);
      if (alpha <= 0) continue;
      const size = layout.cell * scale;
      const mid = cellCenter(layout, g.cell[0], g.cell[1], VIEW_HERE);
      c2.save();
      c2.globalAlpha = alpha;
      c2.translate(mid.x - size / 2, mid.y - size / 2);
      c2.scale(size / CELL, size / CELL);
      // Outline only: the ink is left out so the black keyline is all that swells.
      drawGlyph(c2, g.glyph, { ink: 'rgba(0,0,0,0)', core: PALETTE.key, key: PALETTE.key },
        { ...GLOSS, glyphShadowA: 0 }, GEOMETRY, size, PATHS);
      c2.restore();
    }
  },
};

const scene3 = createCompositor()
  .add(createGroundLayer(VIEW_HERE))
  .add(createFlashLayer(VIEW_HERE))
  .add(fxLayer)
  .add(createGlyphLayer(VIEW_HERE))
  .add(ghostLayer)
  .add(createBurstLayer(VIEW_HERE));

window.renderAt = (ms) => {
  const drawList = sampleTimeline(scene.timeline, ms, ANIM.spin) ?? staticFrame(scene.before);
  scene3.render(ctx, {
    width: canvas.width,
    height: canvas.height,
    ...drawList,
    elapsed: ms,
    layout: boardLayout(scene.before, canvas.width, canvas.height, VIEW_HERE),
    palette: PALETTE,
    gloss: GLOSS,
    geometry: GEOMETRY,
    glyphPaths: PATHS,
    glyphsById: byId,
    animation: ANIM,
  });
};

window.__ready = true;
</script>
</body>
</html>
