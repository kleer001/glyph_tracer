<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Glyph Tracer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main class="stage">
      <div class="topbar">
        <button id="level-open" class="picker" type="button" aria-haspopup="dialog">
          <b id="level-no">01</b><span>levels</span>
        </button>
        <span class="where"><span id="level-act"></span><span id="level-teaches"></span></span>
      </div>
      <canvas id="screen"></canvas>
    </main>
    <aside id="debug-panel" class="panel panel-right"></aside>
  </div>
  <!-- The picker is markup-free until it is built: src/picker.js fills it from the pack. -->
  <div id="sheet-root"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
